name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen      # UI-Tests ohne Bildschirm (echtes Hauptfenster, Menüs, Dialoge)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Qt braucht unter Linux ein paar Systembibliotheken (offscreen: EGL/GL, xkbcommon, fontconfig; enchant für
      # die Rechtschreibung). Windows bringt alles im PySide6-Wheel mit.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libenchant-2-2 qpdf
      # Alle Laufzeitpakete aus requirements.txt (inkl. PySide6) – Kern- UND UI-Tests laufen auf beiden Systemen.
      # pikepdf (libqpdf) prüft jedes erzeugte PDF wie „qpdf --check“; unter Linux läuft zusätzlich das echte qpdf.
      - run: pip install -r requirements.txt "pytest>=8" "pikepdf==10.16.0"
      - run: python -m pytest -q -rs
